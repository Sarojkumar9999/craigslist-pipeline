<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Craigslist Pipeline — Tap to Send</title>
<style>
  :root { --bg:#0f1420; --card:#1a2233; --line:#2a3550; --txt:#e8edf5; --mut:#8b98ad;
          --acc:#4f8cff; --grn:#2fbf71; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt);
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  header { position:sticky; top:0; z-index:10; background:#0c111c; border-bottom:1px solid var(--line);
           padding:12px 14px; }
  header h1 { margin:0 0 2px; font-size:18px; }
  header .sub { color:var(--mut); font-size:12px; }
  .filters { display:flex; gap:8px; padding:10px 14px; flex-wrap:wrap; position:sticky; top:57px;
             background:#0c111c; z-index:9; border-bottom:1px solid var(--line); align-items:center; }
  .filters select, .filters input { background:var(--card); color:var(--txt); border:1px solid var(--line);
             border-radius:8px; padding:8px 10px; font-size:14px; }
  .filters input { flex:1; min-width:120px; }
  .broker { color:var(--mut); font-size:13px; display:flex; align-items:center; gap:6px; }
  #list { padding:12px 14px 80px; display:flex; flex-direction:column; gap:12px; max-width:720px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .card.done { opacity:.45; }
  .card h2 { margin:0 0 4px; font-size:16px; color:#7ab8ff; }
  .card .meta { color:var(--mut); font-size:12px; margin-bottom:8px; }
  .card .title { font-size:14px; margin-bottom:8px; }
  .card .links { display:flex; gap:10px; font-size:13px; margin-bottom:10px; flex-wrap:wrap; }
  .card .links a { color:#7ab8ff; text-decoration:none; }
  .card .norelay { color:var(--mut); font-size:12px; margin-top:8px; }
  .row { display:flex; gap:8px; }
  .send { flex:1; background:var(--grn); color:#06281a; border:0; border-radius:10px;
          padding:14px; font-size:16px; font-weight:700; text-align:center; text-decoration:none; display:block; }
  .donebtn { background:var(--card); color:var(--mut); border:1px solid var(--line); border-radius:10px;
             padding:0 14px; font-size:14px; }
  .card.done .donebtn { color:var(--grn); border-color:var(--grn); }
  .empty { text-align:center; color:var(--mut); padding:40px 20px; }
  .count { color:var(--mut); font-size:12px; padding:0 14px; }
  .emailrow { display:flex; gap:8px; margin-top:8px; }
  .emailinput { flex:1; background:#0c111c; color:var(--txt); border:1px solid var(--line);
             border-radius:8px; padding:10px; font-size:14px; min-width:0; }
  .savebtn { background:var(--acc); color:#fff; border:0; border-radius:8px;
             padding:0 16px; font-size:14px; font-weight:600; }
  /* ---- team login + activity log ---- */
  #loginOverlay { position:fixed; inset:0; background:rgba(0,0,0,.85); z-index:100;
             display:flex; align-items:center; justify-content:center; padding:20px; }
  #loginOverlay.hidden { display:none; }
  .loginbox { background:var(--card); border:1px solid var(--line); border-radius:16px;
             padding:28px 24px; max-width:340px; width:100%; text-align:center; }
  .loginbox h2 { margin:0 0 8px; font-size:20px; }
  .loginbox p { color:var(--mut); font-size:14px; margin:0 0 16px; }
  .loginbox input { width:100%; background:#0c111c; color:var(--txt); border:1px solid var(--line);
             border-radius:10px; padding:12px; font-size:16px; margin-bottom:12px; }
  .loginbox button { width:100%; background:var(--grn); color:#06281a; border:0; border-radius:10px;
             padding:14px; font-size:16px; font-weight:700; }
  .userbar { display:flex; align-items:center; gap:8px; margin-top:6px; font-size:13px; color:var(--mut); }
  .userbar b { color:var(--txt); }
  .userbar button { background:none; border:1px solid var(--line); color:var(--mut); border-radius:6px;
             padding:2px 8px; font-size:12px; }
  .tabs { display:flex; gap:8px; padding:10px 14px 0; max-width:720px; margin:0 auto; }
  .tab { flex:1; background:var(--card); color:var(--mut); border:1px solid var(--line); border-radius:10px 10px 0 0;
             padding:10px; font-size:14px; font-weight:600; border-bottom:0; }
  .tab.active { color:var(--txt); background:#0c111c; }
  #activityView { display:none; padding:12px 14px 80px; max-width:720px; margin:0 auto; }
  #activityView.visible { display:block; }
  .actfilters { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  .actfilters select { background:var(--card); color:var(--txt); border:1px solid var(--line);
             border-radius:8px; padding:8px 10px; font-size:14px; }
  .exportbtn { background:var(--card); color:var(--txt); border:1px solid var(--line); border-radius:8px;
             padding:8px 14px; font-size:14px; }
  .actrow { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px 12px;
             margin-bottom:8px; font-size:13px; }
  .actrow .ats { color:var(--mut); font-size:11px; }
  .actrow .auser { color:#7ab8ff; font-weight:600; }
  .actrow .aaction { font-weight:600; }
  .actstats { color:var(--mut); font-size:12px; margin-bottom:12px; }
  .statgrid { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .statcard { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 14px; flex:1; min-width:120px; }
  .statcard .n { font-size:22px; font-weight:700; color:var(--grn); }
  .statcard .l { font-size:11px; color:var(--mut); }
</style>
</head>
<body>
<header>
  <h1>📋 Craigslist Pipeline</h1>
  <div class="sub" id="summary">loading…</div>
  <div class="userbar" id="userbar" style="display:none">
    👤 <b id="username"></b>
    <button onclick="switchUser()">switch</button>
  </div>
</header>
<div class="tabs">
  <button class="tab active" id="tabLeads" onclick="showTab('leads')">📋 Leads</button>
  <button class="tab" id="tabActivity" onclick="showTab('activity')">📊 Activity</button>
</div>
<div id="leadsView">
<div class="filters">
  <select id="fstate"><option value="">All states</option></select>
  <select id="ftype">
    <option value="">Services + Jobs</option>
    <option value="services">Services ads</option>
    <!-- FIX 2026-10-06: data uses ad_type "hiring", not "jobs". The old value="jobs"
         matched zero rows and hiring ads silently got the services email template. -->
    <option value="hiring">Jobs ads</option>
  </select>
  <input id="q" type="search" placeholder="Search business / city">
  <select id="fdone">
    <option value="todo">To send</option>
    <option value="sent">Sent</option>
    <option value="all">All incl. sent</option>
  </select>
  <select id="femail">
    <option value="">All emails</option>
    <option value="has">With email</option>
    <option value="needs">Needs email</option>
  </select>
  <!-- FIX 2026-10-06: one-tap hide for bulk posters (e.g. lead brokers posting in 40+ cities) -->
  <label class="broker"><input type="checkbox" id="fbroker"> <span id="fbrokerlabel">Hide bulk posters</span></label>
</div>
<div class="count" id="count"></div>
<div id="list"></div>
</div><!-- /leadsView -->
<div id="activityView">
  <div class="statgrid" id="statgrid"></div>
  <div class="actfilters">
    <select id="fuser"><option value="">All team members</option></select>
    <select id="faction">
      <option value="">All actions</option>
      <option value="email_saved">Email saved</option>
      <option value="marked_sent">Marked sent</option>
      <option value="unmarked_sent">Unmarked sent</option>
    </select>
    <button class="exportbtn" onclick="exportActivity()">⬇ Export CSV</button>
  </div>
  <div id="actlist"></div>
</div>
<div id="loginOverlay">
  <div class="loginbox">
    <h2>🔒 Team login</h2>
    <p>Enter the team password and your name.</p>
    <input id="loginPass" type="password" placeholder="Team password" autocomplete="off">
    <input id="loginName" placeholder="Your name" autocomplete="off">
    <button onclick="doLogin()">Start working →</button>
    <p id="loginErr" style="color:#e5484d;display:none;margin-top:8px">Wrong password. Ask Saroj.</p>
  </div>
</div>
<script>
// ---- team config ----
const TEAM_PASSWORD = "careteam2026"; // Saroj: ask me to change this
const GH_REPO = "Sarojkumar9999/craigslist-pipeline";
const GH_TOKEN = ""; // Saroj: paste fine-grained PAT here (contents read+write, this repo only)
const isAdmin = () => (currentUser || "").toLowerCase() === "saroj";
// ---- email templates (approved 2026-10-06) ----
const TPL = {
  services: {
    subject: "Saw your home care ad on Craigslist",
    body:
`Hi {business} team,

I came across your home care ad on Craigslist {city}.

The problem with Craigslist is simple: new clients come in slow, and you still pay to keep the ad up.

I help home-care agencies get clients through Facebook and Instagram ads instead. It often costs less than lead sites, and families contact you directly.

Are you free for 15 mins this week? I can show you on a quick G Meet what other agencies are doing and what I'd do for {business}.

– Saroj

P.S. If someone else handles your marketing, feel free to forward this to them.`
  },
  jobs: {
    subject: "Saw you're hiring caregivers on Craigslist",
    body:
`Hi {business} team,

Noticed your caregiver job post on Craigslist {city}.

Hiring this way is slow. The post sits there, applicants come in one by one, and the good ones get hired somewhere else first.

I help home-care agencies find caregivers through Facebook and Instagram ads. You reach more people, spend less than job boards, and applicants come straight to
 you.

Are you free for 15 mins this week? I can show you on a quick G Meet what other agencies are doing for hiring and what I'd do for {business}.

– Saroj`
  }
};
// FIX 2026-10-06: data labels hiring ads "hiring" — alias so they get the jobs template.
TPL.hiring = TPL.jobs;

// ---- team login + activity log ----
let currentUser = localStorage.getItem("cl_user") || "";
let activityLog = JSON.parse(localStorage.getItem("cl_activity") || "[]");

function doLogin() {
  const pass = (document.getElementById("loginPass").value || "").trim();
  const name = (document.getElementById("loginName").value || "").trim();
  if (pass !== TEAM_PASSWORD) {
    document.getElementById("loginErr").style.display = "block";
    document.getElementById("loginPass").focus();
    return;
  }
  if (!name) { document.getElementById("loginName").focus(); return; }
  currentUser = name;
  localStorage.setItem("cl_user", name);
  document.getElementById("loginOverlay").classList.add("hidden");
  updateUserbar();
  logActivity("login", null, "started session");
  loadSharedData().then(() => render());
}
// ---- GitHub-backed shared storage ----
async function ghRead(path) {
  const res = await fetch(`https://raw.githubusercontent.com/${GH_REPO}/main/${path}?t=${Date.now()}`);
  if (!res.ok) return null;
  return res.json();
}
async function ghWrite(path, data, retries) {
  if (!GH_TOKEN) { console.warn("GH_TOKEN not set, skipping push"); return false; }
  retries = retries || 1;
  try {
    const getRes = await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${path}`, {
      headers: {Authorization: "Bearer " + GH_TOKEN, Accept: "application/vnd.github+json"}});
    const sha = (await getRes.json()).sha;
    const putRes = await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${path}`, {
      method: "PUT",
      headers: {Authorization: "Bearer " + GH_TOKEN, Accept: "application/vnd.github+json",
        "Content-Type": "application/json"},
      body: JSON.stringify({message: "Dashboard: " + path + " update",
        content: btoa(unescape(encodeURIComponent(JSON.stringify(data)))),
        sha: sha, branch: "main"})});
    if (putRes.status === 409 && retries > 0) {
      await new Promise(r => setTimeout(r, 1500));
      return ghWrite(path, data, retries - 1);
    }
    return putRes.ok;
  } catch (e) { console.warn("ghWrite failed", e); return false; }
}
async function loadSharedData() {
  try {
    const [emails, sent, act] = await Promise.all([
      ghRead("docs/data/saved_emails.json"),
      ghRead("docs/data/sent.json"),
      ghRead("docs/data/activity.json")]);
    if (emails) for (const k in emails) savedEmails[k] = emails[k];
    if (sent) for (const k in sent) {
      if (!doneSet.has(k)) doneSet.add(k);
    }
    if (act && Array.isArray(act)) activityLog = act.slice(-5000);
    localStorage.setItem("cl_emails", JSON.stringify(savedEmails));
    saveDone();
    localStorage.setItem("cl_activity", JSON.stringify(activityLog));
  } catch (e) { console.warn("shared load failed, using local", e); }
}
async function pushSharedData() {
  const emailsObj = {};
  for (const k in savedEmails) emailsObj[k] = savedEmails[k];
  const sentObj = {};
  for (const id of doneSet) sentObj[id] = {by: currentUser, at: new Date().toISOString()};
  await Promise.all([
    ghWrite("docs/data/saved_emails.json", emailsObj),
    ghWrite("docs/data/sent.json", sentObj),
    ghWrite("docs/data/activity.json", activityLog.slice(-5000))]);
}
function switchUser() {
  document.getElementById("loginOverlay").classList.remove("hidden");
  document.getElementById("loginName").value = "";
  document.getElementById("loginName").focus();
}
function updateUserbar() {
  const bar = document.getElementById("userbar");
  if (currentUser) {
    bar.style.display = "flex";
    document.getElementById("username").textContent = currentUser;
  } else {
    bar.style.display = "none";
  }
}
function logActivity(action, lead, detail) {
  const entry = {
    ts: new Date().toISOString(),
    user: currentUser || "unknown",
    action: action,
    leadId: lead ? lead.id : "",
    business: lead ? (lead.business || lead.title || "") : "",
    detail: detail || ""
  };
  activityLog.push(entry);
  if (activityLog.length > 5000) activityLog = activityLog.slice(-5000);
  localStorage.setItem("cl_activity", JSON.stringify(activityLog));
  // push to shared GitHub store (fire and forget)
  pushSharedData();
  const hook = localStorage.getItem("cl_webhook");
  if (hook) {
    fetch(hook, {method: "POST", mode: "no-cors",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(entry)}).catch(()=>{});
  }
}
function showTab(which) {
  document.getElementById("tabLeads").classList.toggle("active", which === "leads");
  document.getElementById("tabActivity").classList.toggle("active", which === "activity");
  document.getElementById("leadsView").style.display = which === "leads" ? "" : "none";
  document.getElementById("activityView").classList.toggle("visible", which === "activity");
  if (which === "activity") renderActivity();
}
function renderActivity() {
  const fu = document.getElementById("fuser").value;
  const fa = document.getElementById("faction").value;
  // non-admin sees only their own activity
  const visible = isAdmin() ? activityLog : activityLog.filter(e => e.user === currentUser);
  // per-user stats
  const byUser = {};
  for (const e of visible) {
    if (!byUser[e.user]) byUser[e.user] = {saved: 0, sent: 0};
    if (e.action === "email_saved") byUser[e.user].saved++;
    if (e.action === "marked_sent") byUser[e.user].sent++;
  }
  const users = Object.keys(byUser).sort();
  // user filter dropdown
  const fsel = document.getElementById("fuser");
  const cur = fsel.value;
  fsel.innerHTML = '<option value="">All team members</option>';
  for (const u of users) {
    const o = document.createElement("option");
    o.value = u; o.textContent = `${u} (${byUser[u].saved} emails, ${byUser[u].sent} sent)`;
    fsel.appendChild(o);
  }
  fsel.value = cur;
  // stat cards
  const sg = document.getElementById("statgrid");
  sg.innerHTML = users.map(u =>
    `<div class="statcard"><div class="n">${byUser[u].saved + byUser[u].sent}</div>
     <div class="l">${esc(u)}<br>✉️ ${byUser[u].saved} emails · ✅ ${byUser[u].sent} sent</div></div>`
  ).join("") || '<div class="actstats">No activity yet.</div>';
  // activity rows (newest first)
  const rows = visible.slice().reverse().filter(e =>
    (!fu || e.user === fu) && (!fa || e.action === fa));
  const al = document.getElementById("actlist");
  al.innerHTML = rows.slice(0, 200).map(e => {
    const d = new Date(e.ts);
    const when = d.toLocaleString("en-IN", {day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"});
    const actLabel = {"email_saved": "✉️ saved email", "marked_sent": "✅ marked sent",
      "unmarked_sent": "↩️ unmarked sent", "login": "👋 logged in"}[e.action] || e.action;
    return `<div class="actrow">
      <span class="ats">${when}</span> ·
      <span class="auser">${esc(e.user)}</span>
      <span class="aaction">${actLabel}</span>
      ${e.business ? ` — ${esc(e.business)}` : ""}
      ${e.detail ? `<div class="ats">${esc(e.detail)}</div>` : ""}
    </div>`;
  }).join("") || '<div class="empty">No matching activity.</div>';
}
function exportActivity() {
  const rows = [["timestamp", "user", "action", "lead_id", "business", "detail"]];
  for (const e of activityLog) {
    rows.push([e.ts, e.user, e.action, e.leadId, e.business, e.detail]);
  }
  const csv = rows.map(r => r.map(c => `"${String(c||"").replace(/"/g, '""')}"`).join(",")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], {type: "text/csv"}));
  a.download = "craigslist-activity-" + new Date().toISOString().slice(0, 10) + ".csv";
  a.click();
}

let LEADS = [];
const doneSet = new Set(JSON.parse(localStorage.getItem("cl_done") || "[]"));
const saveDone = () => localStorage.setItem("cl_done", JSON.stringify([...doneSet]));
// Manually saved emails (lead id -> {email, by, at}), synced via GitHub
let savedEmails = JSON.parse(localStorage.getItem("cl_emails") || "{}");
const saveEmails = () => localStorage.setItem("cl_emails", JSON.stringify(savedEmails));
// Effective email: scraped relay first, then manually saved (handles old string format too)
const leadEmail = (l) => {
  if (l.relay) return l.relay;
  const s = savedEmails[l.id];
  if (!s) return "";
  return typeof s === "string" ? s : (s.email || "");
};
const savedBy = (l) => {
  const s = savedEmails[l.id];
  return (s && typeof s === "object") ? (s.by || "") : "";
};
let bizCounts = {};

function mailto(lead) {
  const t = TPL[lead.ad_type] || TPL.services;
  const biz = lead.business || "there";
  const subj = t.subject;
  const body = t.body.replaceAll("{business}", biz).replaceAll("{city}", lead.city || "");
  // FIX 2026-10-06: no relay emails were collected (Craigslist hCaptcha on reply click).
  // Old code built "mailto:null". Empty recipient opens compose with subject+body ready;
  // the sender pastes the relay address grabbed from the ad into the To field.
  // 2026-10-07: also picks up manually saved emails from localStorage.
  const to = leadEmail(lead);
  return "mailto:" + to +
    "?subject=" + encodeURIComponent(subj) +
    "&body=" + encodeURIComponent(body);
}

function render() {
  const fs = document.getElementById("fstate").value;
  const ft = document.getElementById("ftype").value;
  const q = document.getElementById("q").value.trim().toLowerCase();
  const fd = document.getElementById("fdone").value;
  const fe = document.getElementById("femail").value;
  const hideBulk = document.getElementById("fbroker").checked;
  const list = document.getElementById("list");
  list.innerHTML = "";
  let shown = 0;
  for (const l of LEADS) {
    const isDone = doneSet.has(l.id);
    const hasEmail = !!leadEmail(l);
    if (fd === "todo" && isDone) continue;
    if (fd === "sent" && !isDone) continue;
    if (fe === "has" && !hasEmail) continue;
    if (fe === "needs" && hasEmail) continue;
    if (fs && l.state !== fs) continue;
    if (ft && l.ad_type !== ft) continue;
    if (q && !((l.business||"") + " " + (l.title||"") + " " + (l.city||"")).toLowerCase().includes(q)) continue;
    if (hideBulk) {
      const k = (l.business || "").toLowerCase().trim();
      if (k && (bizCounts[k] || 0) > 10) continue;
    }
    shown++;
    const d = document.createElement("div");
    d.className = "card" + (isDone ? " done" : "");
    const age = l.posted ? ` · posted ${l.posted}` : "";
    d.innerHTML =
      `<h2>${esc(l.business || "(unknown business)")}</h2>
       <div class="meta">${esc(l.city||"")}${l.state?", "+esc(l.state):""} · ${l.ad_type==="hiring"?"💼 jobs ad":"🛎️ services ad"}${age}</div>
       <div class="title">${esc(l.title||"")}</div>
       <div class="links">
         <a href="${esc(l.url)}" target="_blank" rel="noopener">Craigslist ad ↗</a>
         ${l.phone ? `<span>📞 ${esc(l.phone)}</span>` : ""}
         ${l.website ? `<a href="${esc(webUrl(l.website))}" target="_blank" rel="noopener">Website ↗</a>` : ""}
       </div>
       <div class="row">
         <a class="send" href="${mailto(l)}">${hasEmail ? "✉️ Send email" : "✉️ Compose — paste email"}</a>
         <button class="donebtn">${isDone ? "✓ sent" : "mark sent"}</button>
       </div>
       ${hasEmail
         ? (savedEmails[l.id] ? `<div class="norelay">✉️ ${esc(leadEmail(l))} (saved by ${esc(savedBy(l) || "you")})</div>` : "")
         : `<div class="emailrow">
              <input type="email" class="emailinput" placeholder="Paste email address" inputmode="email">
              <button class="savebtn">Save</button>
            </div>
            <div class="norelay">No email saved for this ad — open the Craigslist ad, tap reply, copy the email address, paste it above and hit Save.</div>`}`;
    d.querySelector(".donebtn").onclick = () => {
      if (isDone) { doneSet.delete(l.id); logActivity("unmarked_sent", l, ""); }
      else { doneSet.add(l.id); logActivity("marked_sent", l, ""); }
      saveDone(); render();
    };
    const saveBtn = d.querySelector(".savebtn");
    if (saveBtn) {
      saveBtn.onclick = () => {
        const inp = d.querySelector(".emailinput");
        const em = (inp.value || "").trim();
        if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) { inp.focus(); inp.style.borderColor = "#e5484d"; return; }
        savedEmails[l.id] = {email: em, by: currentUser, at: new Date().toISOString()};
        saveEmails();
        logActivity("email_saved", l, em);
        render();
      };
    }
    list.appendChild(d);
  }
  document.getElementById("count").textContent = shown + " to send · " + doneSet.size + " marked sent";
  if (!shown) list.innerHTML = '<div class="empty">Nothing here. Try clearing filters.</div>';
}

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
// FIX 2026-10-06 (main): website values often lack a scheme (e.g. "www.foo.com"),
// which the browser resolves as a relative path -> GitHub Pages 404. Normalize.
function webUrl(w){ return /^https?:\/\//i.test(w) ? w : "https://" + w; }

fetch("./data/leads.json")
  .then(r => r.json())
  .then(j => {
    // FIX 2026-10-06: tolerate both the wrapped schema {leads:[...]} and a bare array,
    // so a future merge that forgets the wrapper can't silently zero the dashboard again.
    LEADS = Array.isArray(j) ? j : (j.leads || []);
    const scrapedAt = Array.isArray(j) ? "overnight crawl" : (j.scraped_at || "?");
    document.getElementById("summary").textContent =
      `${LEADS.length} leads · scraped ${scrapedAt}`;
    const states = [...new Set(LEADS.map(l => l.state).filter(Boolean))].sort();
    const sel = document.getElementById("fstate");
    for (const s of states) { const o = document.createElement("option"); o.value = s; o.textContent = s; sel.appendChild(o); }
    bizCounts = {};
    for (const l of LEADS) { const k = (l.business || "").toLowerCase().trim(); if (k) bizCounts[k] = (bizCounts[k] || 0) + 1; }
    const bulkRows = LEADS.filter(l => { const k = (l.business || "").toLowerCase().trim(); return k && (bizCounts[k] || 0) > 10; }).length;
    document.getElementById("fbrokerlabel").textContent = `Hide bulk posters (${bulkRows} rows)`;
    render();
  })
  .catch(() => { document.getElementById("summary").textContent = "no data yet — scrape running"; });

["fstate","ftype","fdone","femail","fbroker"].forEach(id => document.getElementById(id).addEventListener("change", render));
document.getElementById("q").addEventListener("input", render);
document.getElementById("fuser").addEventListener("change", renderActivity);
document.getElementById("faction").addEventListener("change", renderActivity);
// init login: show overlay if no saved name
updateUserbar();
if (!currentUser) {
  document.getElementById("loginOverlay").classList.remove("hidden");
} else {
  document.getElementById("loginOverlay").classList.add("hidden");
  // load shared team data in background, then re-render
  loadSharedData().then(() => { render(); if (document.getElementById("activityView").classList.contains("visible")) renderActivity(); });
}
document.getElementById("loginName").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
document.getElementById("loginPass").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
</script>
